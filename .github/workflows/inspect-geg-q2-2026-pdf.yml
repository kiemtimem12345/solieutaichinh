name: Inspect GEG consolidated 2026 Q2 original PDF
on:
  push:
    branches: [main, work/geg-2026q2-consolidated-original-source-20261119]
    paths:
      - 'scripts/inspect_geg_q2_2026_pdf.py'
      - '.github/workflows/inspect-geg-q2-2026-pdf.yml'
  pull_request:
    paths:
      - 'scripts/inspect_geg_q2_2026_pdf.py'
      - '.github/workflows/inspect-geg-q2-2026-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install short-lived PDF renderer and optional local OCR
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Read and render GEG Q2 2026 consolidated original disclosure without data writes
        run: python -u scripts/inspect_geg_q2_2026_pdf.py
      - name: Export original public statement pages for visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geg-2026-q2-original-consolidated-statement-pages
          path: geg-q2-renders/*.png
          if-no-files-found: warn
          retention-days: 3
