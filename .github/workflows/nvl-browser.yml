name: NVL browser acceptance
on:
  pull_request:
    paths:
      - 'assets/app.js'
      - 'index.html'
      - 'data/financials-NVL.json'
      - 'scripts/verify_nvl_browser.cjs'
      - '.github/workflows/nvl-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.51.1 chart.js@4.4.8
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nvl-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null
          node scripts/verify_nvl_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvl-browser-evidence
          path: nvl-quarter-browser.png
          retention-days: 3
          if-no-files-found: ignore
