name: Inspect original VCI Q1 2026 signed issuer PDF (read-only)
on:
  push:
    branches: [work/vci-2026q1-signed-source-20261121]
    paths:
      - scripts/inspect_vci_2026q1_original_source.py
      - .github/workflows/inspect-vci-2026q1-original.yml
  pull_request:
    paths:
      - scripts/inspect_vci_2026q1_original_source.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Validate syntax
        run: python -m py_compile scripts/inspect_vci_2026q1_original_source.py
      - name: Read source identity and B01 B02 B03 original pages
        run: python -u scripts/inspect_vci_2026q1_original_source.py
      - name: Keep selected PDF page previews only 1 day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-2026q1-signed-source-page-previews
          path: vci-2026q1-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
