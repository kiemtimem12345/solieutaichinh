name: Inspect IDC consolidated 2026 Q3 original PDF sources
on:
  push:
    branches: [main, work/idc-2026q3-original-pdf-source-recovery-20261119]
    paths:
      - 'scripts/inspect_idc_q3_2026_pdf.py'
      - '.github/workflows/inspect-idc-q3-2026-pdf.yml'
  pull_request:
    paths:
      - 'scripts/inspect_idc_q3_2026_pdf.py'
      - '.github/workflows/inspect-idc-q3-2026-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral PDF viewer and local OCR fallback
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Recover and inspect exact HNX originals or BSC-distributed copies
        run: python -u scripts/inspect_idc_q3_2026_pdf.py
      - name: Archive public original statement images for source QA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idc-q3-2026-original-report-preview
          path: idc-q3-report-images/*.png
          if-no-files-found: warn
          retention-days: 3
