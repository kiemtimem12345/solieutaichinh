name: Recover PLX Q4 2025 consolidated and audited FY2025 originals
on:
  push:
    branches: [work/plx-2025q4-original-and-fy-audited-20261120]
    paths:
      - scripts/recover_plx_2025q4_and_fy_audited_originals.py
      - .github/workflows/recover-plx-2025q4-and-fy-audited-originals.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Retrieve exact full originals with SHA and render signed source pages
        run: python -u scripts/recover_plx_2025q4_and_fy_audited_originals.py
      - name: Preserve whole original PDFs and image evidence for B01 B02 B03 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-2025q4-fy-audited-original-PDFs-and-images
          path: plx-2025q4-annual-original/
          if-no-files-found: warn
          retention-days: 7
