name: Probe Hostinger SSH SFTP port (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_hostinger_sftp.py'
      - '.github/workflows/probe-hostinger-sftp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe SSH service port 65002 without authentication
        run: python scripts/probe_hostinger_sftp.py
