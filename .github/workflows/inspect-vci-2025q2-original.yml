name: Inspect VCI Q2 2025 original signed scanned PDF (read-only)
on:
  push:
    branches: [work/vci-2025q2-original-exact-source-20261121]
    paths:
      - scripts/inspect_vci_2025q2_original_source.py
      - .github/workflows/inspect-vci-2025q2-original.yml
  pull_request:
    paths:
      - scripts/inspect_vci_2025q2_original_source.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install scanned PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Validate syntax
        run: python -m py_compile scripts/inspect_vci_2025q2_original_source.py
      - name: Download and verify VCI Q2 2025 original signed PDF, produce limited previews
        run: python -u scripts/inspect_vci_2025q2_original_source.py
      - name: Upload limited scanned original PDF page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-2025q2-original-signed-page-previews
          path: vci-2025q2-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
