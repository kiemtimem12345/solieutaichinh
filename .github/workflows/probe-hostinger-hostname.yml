name: Check candidate FTPS hostname DNS and TLS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_hostinger_hostname.py'
      - '.github/workflows/probe-hostinger-hostname.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test server545.hstgr.io without login
        run: python scripts/probe_hostinger_hostname.py
