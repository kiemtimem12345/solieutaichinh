name: VIX 2025 Q1 Q2 signed original source recovery
on:
  push:
    branches: [work/vix-2025-q1q2-original-source-audit-20261121]
    paths:
      - scripts/recover_vix_2025q1q2_original.py
      - .github/workflows/recover-vix-2025q1q2-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Download VIX Q1 Q2 2025 primary signed documents and render B01 B02 B03
        run: python -u scripts/recover_vix_2025q1q2_original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIX-2025Q1Q2-original-PDF-and-page-images
          path: vix-2025-q1q2-source-audit/
          retention-days: 5
          if-no-files-found: warn
