name: Inspect VCB Q1 2025 consolidated signed issuer original (read-only)
on:
  push:
    branches: [work/vcb-2025q1-consolidated-signed-source-20261122]
    paths:
      - scripts/inspect_vcb_2025q1_consolidated_source.py
      - .github/workflows/inspect-vcb-2025q1-original.yml
  pull_request:
    paths:
      - scripts/inspect_vcb_2025q1_consolidated_source.py
      - .github/workflows/inspect-vcb-2025q1-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF utilities
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Syntax check
        run: python -m py_compile scripts/inspect_vcb_2025q1_consolidated_source.py
      - name: Recover consolidated Q1 signed report, source SHA and financial pages
        run: python -u scripts/inspect_vcb_2025q1_consolidated_source.py
      - name: Short-lived signed B01 B02 B03 page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcb-2025q1-consolidated-original-previews
          path: vcb-2025q1-consolidated-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
