name: Audit public website frontend resources (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_public_site.py'
      - '.github/workflows/audit-public-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe HTML, assets and JSON endpoints
        run: python scripts/audit_public_site.py
