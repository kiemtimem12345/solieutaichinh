name: Inventory Hostinger webroot (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inventory_hostinger_webroot.py'
      - '.github/workflows/inventory-hostinger-webroot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SFTP client
        run: python -m pip install --disable-pip-version-check 'paramiko>=3.5,<5'
      - name: Inventory website files without remote writes
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python scripts/inventory_hostinger_webroot.py
