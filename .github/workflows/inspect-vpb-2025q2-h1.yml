name: Inspect VPB 2025 Q2 signed original and reviewed H1 (read-only)
on:
  pull_request:
    paths:
      - 'scripts/inspect_vpb_2025q2_h1_sources.py'
      - '.github/workflows/inspect-vpb-2025q2-h1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpb-2025q2-h1-source
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Test original source inspector
        run: python -m py_compile scripts/inspect_vpb_2025q2_h1_sources.py
      - name: Recover VPB original Q2 and KPMG-reviewed 2025 H1
        run: python -u scripts/inspect_vpb_2025q2_h1_sources.py
      - name: Keep bank B02a B03a B04a visual sources briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpb-2025q2-reviewedH1-source-pages
          path: vpb-2025q2-h1-source/*
          retention-days: 1
          if-no-files-found: warn
