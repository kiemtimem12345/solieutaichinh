name: NVL source byte verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nvl-source-verification.yml'
      - 'scripts/verify-nvl-source-bytes.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PDF reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify public PDF sources
        run: python3 scripts/verify-nvl-source-bytes.py
      - name: Save verification metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvl-source-verification
          path: nvl-source-verification.json
          retention-days: 14
      - name: Save selected statement page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvl-statement-page-evidence
          path: nvl-page-evidence/
          retention-days: 3
          if-no-files-found: error
