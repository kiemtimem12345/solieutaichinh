name: Visual QA IDC original 2026 Q3 B01 B02 B03
on:
  push:
    branches: [work/idc-2026q3-original-pdf-source-recovery-20261119]
    paths:
      - 'scripts/emit_idc_q3_2026_visual_jpeg.py'
      - '.github/workflows/visual-idc-q3-2026-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral native PDF renderer and jpeg
        run: pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28' 'pillow>=10,<13'
      - name: Render B01 B02 B03 from hash-verified issuer PDF for human visual QA
        run: python -u scripts/emit_idc_q3_2026_visual_jpeg.py
