name: Inspect STB signed original 2026 Q1 bank B02 B03 B04
on:
  pull_request:
    paths:
      - 'scripts/inspect_stb_2026q1_signed.py'
      - '.github/workflows/inspect-stb-2026q1-signed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stb-2026q1-source
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Setup PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils tesseract-ocr tesseract-ocr-vie
      - name: Validate source inspector
        run: python -m py_compile scripts/inspect_stb_2026q1_signed.py
      - name: Pin and inspect issuer original signed bank source
        run: python -u scripts/inspect_stb_2026q1_signed.py
      - name: Store one-day source text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stb-2026q1-signed-source
          path: stb-2026q1-original/*.txt
          retention-days: 1
          if-no-files-found: warn
