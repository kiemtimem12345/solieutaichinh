name: Inspect GAS original consolidated 2026 Q1/Q2 PDF
on:
  push:
    branches: [main, work/gas-2026q1q2-source-pdf-inspection-20261119]
    paths:
      - 'scripts/inspect_gas_2026_q1_q2_pdf.py'
      - '.github/workflows/inspect-gas-2026-q1-q2.yml'
  pull_request:
    paths:
      - 'scripts/inspect_gas_2026_q1_q2_pdf.py'
      - '.github/workflows/inspect-gas-2026-q1-q2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        period: ['2026-Q1', '2026-Q2']
    env:
      GAS_PERIOD: ${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral PDF viewer and local OCR
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Inspect PV GAS original consolidated report without production writes
        run: python -u scripts/inspect_gas_2026_q1_q2_pdf.py
      - name: Upload selected report page images for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-original-${{ matrix.period }}-pages
          path: report-pages/*.png
          if-no-files-found: warn
          retention-days: 3
