name: Inspect VCB Q4 2025 signed consolidated original (read-only)
on:
  push:
    branches: [work/vcb-2025q4-signed-FY-audited-source-20261122]
    paths:
      - scripts/inspect_vcb_2025q4_consolidated_source.py
      - .github/workflows/inspect-vcb-2025q4-original.yml
  pull_request:
    paths:
      - scripts/inspect_vcb_2025q4_consolidated_source.py
      - .github/workflows/inspect-vcb-2025q4-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Check Python inspector syntax
        run: python -m py_compile scripts/inspect_vcb_2025q4_consolidated_source.py
      - name: Hash original VCB Q4 2025 B02 B03 B04 source document
        run: python -u scripts/inspect_vcb_2025q4_consolidated_source.py
      - name: Retain signed original selected-page previews for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcb-2025q4-consolidated-original-source-preview
          path: vcb-2025q4-consolidated-previews/*.jpg
          retention-days: 1
          if-no-files-found: warn
