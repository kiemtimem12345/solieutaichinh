name: Inspect GEG IDC H1 2026 reviewed original PDF sources (source-only)
on:
  push:
    branches: [work/geg-idc-review-source-20261121]
    paths:
      - 'scripts/inspect_geg_idc_h1_2026_reviewed_retrieval.py'
      - '.github/workflows/inspect-geg-idc-h1-2026-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate PDF retrieval code syntax
        run: python -m py_compile scripts/inspect_geg_idc_h1_2026_reviewed_retrieval.py
      - name: Check signed PDF binaries and selected source notes (no files archived)
        run: python -u scripts/inspect_geg_idc_h1_2026_reviewed_retrieval.py
