name: Inspect VCK Q3/2025 original VPSS signed issuer ZIP (read-only)
on:
  push:
    branches: [work/vck-2025q3-original-signed-source-20261122]
    paths:
      - scripts/inspect_vck_2025q3_vps_zip_source.py
      - .github/workflows/inspect-vck-2025q3-original.yml
  pull_request:
    paths:
      - scripts/inspect_vck_2025q3_vps_zip_source.py
      - .github/workflows/inspect-vck-2025q3-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler and curl
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Check source inspector syntax
        run: python -m py_compile scripts/inspect_vck_2025q3_vps_zip_source.py
      - name: Verify signed VPS Q3 issuer ZIP and selected original pages
        run: python -u scripts/inspect_vck_2025q3_vps_zip_source.py
      - name: Archive only limited evidence images for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vck-2025q3-vps-signed-page-previews
          path: vck-2025q3-original-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
