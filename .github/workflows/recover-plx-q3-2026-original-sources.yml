name: Inspect signed original PLX Q3 parent B03 PDF
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover and render signed original PLX issuer parent Q3 PDF
        run: python -u scripts/recover_plx_q3_2026_original_sources.py
      - name: Preserve source PDF, original page images, and hash provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-q3-2026-original-pdf-pages-and-evidence
          path: plx-q3-2026-original-source-qa/
          if-no-files-found: warn
          retention-days: 7
