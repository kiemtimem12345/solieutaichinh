name: Verify VPB 2026 H1 reviewed scanned bank B04 through targeted OCR
on:
  pull_request:
    paths:
      - 'scripts/inspect_vpb_2026h1_reviewed_scanned_B04.py'
      - '.github/workflows/inspect-vpb-2026h1-scanned-ocr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpb-2026h1-scanned-source
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and Vietnamese OCR only for scanned report
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-vie
      - name: Validate OCR inspector
        run: python -m py_compile scripts/inspect_vpb_2026h1_reviewed_scanned_B04.py
      - name: Read 8 reviewed H1 statement pages
        run: python -u scripts/inspect_vpb_2026h1_reviewed_scanned_B04.py
