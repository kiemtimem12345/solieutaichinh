name: Inspect VCI Q2 and reviewed H1 2026 original PDFs (read-only)
on:
  pull_request:
    paths:
      - scripts/inspect_vci_2026h1_signed_pdf_sources.py
      - .github/workflows/inspect-vci-2026h1-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install source PDF reader and bounded curl
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Verify script syntax
        run: python -m py_compile scripts/inspect_vci_2026h1_signed_pdf_sources.py
      - name: Inspect original VCI source PDFs without saving original binaries
        run: python -u scripts/inspect_vci_2026h1_signed_pdf_sources.py
      - name: Upload limited scanned source-page previews for accounting visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-2026-h1-q2-signed-statement-page-previews
          path: vci-source-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
