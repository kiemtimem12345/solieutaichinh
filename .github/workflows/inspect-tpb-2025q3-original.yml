name: Inspect TPB 2025 Q3 signed original consolidated (read-only)
on:
  pull_request:
    paths:
      - 'scripts/inspect_tpb_2025q3_original.py'
      - '.github/workflows/inspect-tpb-2025q3-original.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpb-2025q3-original-source
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Validate inspector syntax
        run: python -m py_compile scripts/inspect_tpb_2025q3_original.py
      - name: Fetch original TPB Q3 signed source and render statement pages
        run: python -u scripts/inspect_tpb_2025q3_original.py
      - name: Keep original source image evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpb-2025q3-original-source-pages
          path: tpb-2025q3-original-evidence/*
          retention-days: 1
          if-no-files-found: warn
