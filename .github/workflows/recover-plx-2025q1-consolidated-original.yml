name: Recover PLX Q1 2025 original consolidated B01 B02 B03
on:
  push:
    branches: [work/plx-2025q1-original-b01b02b03-20261120]
    paths:
      - scripts/recover_plx_q1_2025_consolidated_original.py
      - .github/workflows/recover-plx-2025q1-consolidated-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover exact full Q1 source and render B01 B02 B03 candidate pages
        run: python -u scripts/recover_plx_q1_2025_consolidated_original.py
      - name: Preserve original PDF and visual-page evidence for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-2025q1-original-consolidated-b01b02b03
          path: plx-2025-q1-consolidated-original/
          retention-days: 7
          if-no-files-found: warn
