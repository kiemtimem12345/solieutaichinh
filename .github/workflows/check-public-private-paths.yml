name: Check public website private-path exposure (HEAD only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_public_private_paths.py'
      - '.github/workflows/check-public-private-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe private path HTTP status without downloading content
        run: python -u scripts/check_public_private_paths.py
