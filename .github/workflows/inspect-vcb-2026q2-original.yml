name: Inspect VCB 2026Q2 issuer original consolidated H1 (read-only)
on:
  push:
    branches: [work/vcb-2026q2-signed-H1-consolidated-20261122]
    paths:
      - scripts/inspect_vcb_2026q2_original.py
      - .github/workflows/inspect-vcb-2026q2-original.yml
  pull_request:
    paths:
      - scripts/inspect_vcb_2026q2_original.py
      - .github/workflows/inspect-vcb-2026q2-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF utilities
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Check source inspector syntax
        run: python -m py_compile scripts/inspect_vcb_2026q2_original.py
      - name: Verify VCB issuer H1 original signed B02 B03 B04
        run: python -u scripts/inspect_vcb_2026q2_original.py
      - name: Retain selected source financial pages one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcb-2026q2-signed-consolidated-H1-original-previews
          path: vcb-2026q2-consolidated-preview/*.jpg
          retention-days: 1
          if-no-files-found: warn
