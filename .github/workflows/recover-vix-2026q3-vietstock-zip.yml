name: Recover VIX 2026 Q3 original via Vietstock ZIP and issuer mirror
on:
  push:
    branches: [work/vix-2026-q1q2q3-signed-original-completion-20261121]
    paths:
      - scripts/recover_vix_q3_2026_from_vietstock_zip.py
      - .github/workflows/recover-vix-2026q3-vietstock-zip.yml
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover signed source and inspect ZIP
        run: python -u scripts/recover_vix_q3_2026_from_vietstock_zip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vix-q3-2026-vietstock-zip-and-signed-pdf
          path: vix-q3-2026-vietstock-recovery/
          retention-days: 4
