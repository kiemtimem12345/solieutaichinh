name: Inspect VPS VCK 2026Q3 signed original (read-only)
on:
  push:
    branches: [work/vck-2026q3-HOSE-original-9M-reviewed-H1-20261122]
    paths:
      - scripts/inspect_vck_2026q3_original.py
      - .github/workflows/inspect-vck-2026q3-original.yml
  pull_request:
    paths:
      - scripts/inspect_vck_2026q3_original.py
      - .github/workflows/inspect-vck-2026q3-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Syntax check
        run: python -m py_compile scripts/inspect_vck_2026q3_original.py
      - name: Verify signed B01 B02 B03 source identity
        run: python -u scripts/inspect_vck_2026q3_original.py
      - name: Retain brief source images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vck-2026q3-original-pdf-preview
          path: vck-2026q3-source-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
