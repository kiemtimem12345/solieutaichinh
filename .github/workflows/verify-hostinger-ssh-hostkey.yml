name: Verify Hostinger SSH host fingerprint
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_hostinger_ssh_hostkey.sh'
      - '.github/workflows/verify-hostinger-ssh-hostkey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare ED25519 key to Hostinger hPanel fingerprint
        run: bash scripts/verify_hostinger_ssh_hostkey.sh
