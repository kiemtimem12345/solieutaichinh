name: Recover PLX 2026 Q1 consolidated signed original B01 B02 B03
on:
  push:
    branches: [work/plx-2026q1-signed-original-visual-20261120]
    paths:
      - scripts/recover_plx_q1_2026_consolidated_original.py
      - .github/workflows/recover-plx-2026q1-consolidated-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Download original signed issuer PLX Q1 2026 and render first 19 pages
        run: python -u scripts/recover_plx_q1_2026_consolidated_original.py
      - name: Preserve full source PDF for B01 B02 B03 visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-2026q1-original-consolidated-B01-B02-B03
          path: plx-2026-q1-consolidated-original/
          retention-days: 7
          if-no-files-found: warn
