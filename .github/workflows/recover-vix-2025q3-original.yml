name: Recover VIX 2025 Q3 original signed PDF for B01 B02 B03 QA
on:
  push:
    branches: [work/vix-2025q3-signed-source-recovery-20261121]
    paths:
      - scripts/recover_vix_2025q3_original.py
      - .github/workflows/recover-vix-2025q3-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover VIX signed issuer Q3 and Vietstock PDF plus first 24 page images
        run: python -u scripts/recover_vix_2025q3_original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIX-2025Q3-signed-original-and-page-images
          path: vix-2025q3-original-audit/
          retention-days: 5
          if-no-files-found: warn
