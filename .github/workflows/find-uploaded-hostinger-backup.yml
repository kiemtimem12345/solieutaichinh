name: Find uploaded Hostinger backup by location (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/find_uploaded_hostinger_backup.py'
      - '.github/workflows/find-uploaded-hostinger-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSH client
        run: python -m pip install --disable-pip-version-check 'paramiko>=3.5,<5'
      - name: Search expected and nearby folders for backup archive without reading contents
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python scripts/find_uploaded_hostinger_backup.py
