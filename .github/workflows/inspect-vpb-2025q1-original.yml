name: Inspect VPB 2025 Q1 original signed bank consolidated (read-only)
on:
  pull_request:
    paths:
      - 'scripts/inspect_vpb_2025q1_original.py'
      - '.github/workflows/inspect-vpb-2025q1-original.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpb-2025q1-issuer-original
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bank signed-PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Confirm inspector syntax
        run: python -m py_compile scripts/inspect_vpb_2025q1_original.py
      - name: Fetch VPB 2025 Q1 original consolidated B02a B03a B04a
        run: python -u scripts/inspect_vpb_2025q1_original.py
      - name: Store source-only originals briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpb-2025q1-issuer-signed-source-pages
          path: vpb-2025q1-original-evidence/*
          retention-days: 1
          if-no-files-found: warn
