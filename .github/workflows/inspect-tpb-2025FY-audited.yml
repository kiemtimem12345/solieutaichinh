name: Inspect TPBank official audited FY2025 consolidated financial statements (read-only)
on:
  pull_request:
    paths:
      - 'scripts/inspect_tpb_FY2025_official_audited.py'
      - '.github/workflows/inspect-tpb-2025FY-audited.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpb-2025FY-official-audited
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official-PDF inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Check official-source inspector syntax
        run: python -m py_compile scripts/inspect_tpb_FY2025_official_audited.py
      - name: Fetch signed official TPBank FY2025 audited consolidated PDF
        run: python -u scripts/inspect_tpb_FY2025_official_audited.py
      - name: Retain short-lived issuer-signed audited source previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpb-2025FY-official-audited-previews
          path: tpb-2025FY-official-audited/*
          retention-days: 1
          if-no-files-found: warn
