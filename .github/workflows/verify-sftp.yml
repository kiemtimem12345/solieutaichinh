name: Verify Hostinger SFTP read-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install password authentication helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify password SFTP with pinned host key (no remote writes)
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DATA_DIR: ${{ vars.SFTP_DATA_DIR }}
        run: bash scripts/check_sftp.sh
