name: Visual QA IDC consolidated 2026 Q2 original B01 B02 B03
on:
  push:
    branches: [work/idc-2026q2-h1-original-20261119]
    paths:
      - 'scripts/emit_idc_q2_2026_visual_jpeg.py'
      - '.github/workflows/visual-idc-q2-2026-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral PDF renderer
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28' 'pillow>=10,<13'
      - name: Inspect official HNX consolidated Q2 original and render 6M cashflow
        run: python -u scripts/emit_idc_q2_2026_visual_jpeg.py
