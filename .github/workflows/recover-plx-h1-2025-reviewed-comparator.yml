name: Recover PLX H1 2025 reviewed source for Q3 9M-vs-quarter mismatch
on:
  push:
    branches: [work/plx-2025q3-original-b01b02b03-20261120]
    paths:
      - scripts/recover_plx_h1_2025_reviewed_comparator.py
      - .github/workflows/recover-plx-h1-2025-reviewed-comparator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover PLX H1 reviewed issuer source and render B02 and B03 pages
        run: python -u scripts/recover_plx_h1_2025_reviewed_comparator.py
      - name: Preserve original signed PDF and visual pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-h1-2025-reviewed-consolidated-comparator
          path: plx-2025-h1-reviewed-original/
          retention-days: 7
          if-no-files-found: warn
