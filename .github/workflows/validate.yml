name: Validate financial snapshots
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python scripts syntax
        run: python -m py_compile scripts/*.py
      - name: Validate original dashboard JS and 41 tracked JSON files
        run: |
          node --check assets/app.js
          python -c 'from scripts.verify_live_site import validate_checkout; validate_checkout()'
      - name: Verify 2026 Q3 signed MBB consolidated bank B02a B03a B04a 27 source identities and independent quarter cash
        run: python scripts/verify_mbb_2026q3_signed_original.py
      - name: Verify 7 quarters MBB bank P&L against signed B03a current-quarter sources
        run: python scripts/verify_mbb_income.py
      - name: Audit report scope and distinguish missing from unconfirmed
        run: python scripts/audit_all_statement_coverage.py > /dev/null
      - name: Enforce fiscal-year accounting regime transition and GEG IDC Q2 B03 source-vintage gates
        run: python scripts/verify_reporting_regime_transitions.py
      - name: Check officially verified PLX Q3 parent and consolidated profit
        run: python scripts/verify_plx_issuer_q3.py
      - name: Verify PLX 2026 Q3 consolidated original 40 exact-VND identities and reviewed H1 standalone cash
        run: python scripts/verify_plx_q3_2026_consolidated_original.py
      - name: Verify PLX consolidated Q1 2025 original signed B01 B02 B03, 40 exact VND identities
        run: python scripts/verify_plx_q1_2025_original.py
      - name: Verify PLX 2025 Q2 signed source 104 VND fields and H1-minus-Q1 43 cash and balance identities
        run: python scripts/verify_plx_q2_2025_original.py
      - name: Verify PLX signed Q3 2025 original and KPMG reviewed H1 same-vintage 9M-minus-H1 cash and B02 anomalies
        run: python scripts/verify_plx_q3_2025_reviewed_h1.py
      - name: Verify PLX Q4 2025 original vs audited FY signed accounting vintages, quarantine quarter cash
        run: python scripts/verify_plx_q4_2025_original_vs_audited_vintage.py
      - name: Verify VCI 2025 Q2 signed B01 B02 and PwC reviewed H1 B03 cash with exact VND quarter bridge
        run: python scripts/verify_vci_2025q2_signed_original_reviewed_h1.py
      - name: Verify VCI Q1 2025 issuer signed 48 source fields, 11 VND identities, Note1 no-subs and anti-OCR controls
        run: python scripts/verify_vci_2025q1_signed_original.py
      - name: Verify VCI 2026 Q3 signed 9M minus PwC reviewed H1 and issuer Q2 scanned 6M exact-VND quarter B03
        run: python scripts/verify_vci_2026q3_h1_reviewed_cash_bridge.py
      - name: Verify VCI Q3 2026 signed HOSE broker source B01 B02 B03 64 fields and no-subsidiaries client cash isolation
        run: python scripts/verify_vci_2026q3_issuer_no_subs_source.py
      - name: Verify VIX 2026 Q1 Q2 Q3 signed original B01 B02 B03 54 VND source identities, quarterly bridges and 7 negative controls
        run: python scripts/verify_vix_2026q1q2q3_signed_original.py
      - name: Verify VIX 2026 Q1 issuer TT334 specialized historical core vs complete signed original
        run: python scripts/verify_vix_2026q1_issuer_tt334_core.py
      - name: Verify Vietnam accounting law VAS and securities financial source checks, 2025 signed source and 2026 fail-closed
        run: python scripts/verify_accounting_legal_framework.py
      - name: Verify VIX 2025 Q4 signed issuer separate B01 B02 B03 17 exact VND checks and FY vintage isolation
        run: python scripts/verify_vix_2025q4_signed_original.py
      - name: Verify VIX 2025 Q3 signed separate B01 B02 B03 15 exact identities and Q3 standalone cash
        run: python scripts/verify_vix_2025q3_signed_original.py
      - name: Verify VIX Q1 Q2 2025 signed original B01 B02 20 exact identities and H1 bridge
        run: python scripts/verify_vix_2025q1q2_original_b01_b02.py
      - name: Verify VIX 2025 Q1 Q2 original signed B03 VND, standalone Q2 and fail-closed cashflow guards
        run: python scripts/verify_vix_2025q1q2_original_cash.py
      - name: Verify PLX Q1 2026 signed original, 34 exact VND identities and quarantine two B01 source mismatches
        run: python scripts/verify_plx_q1_2026_original.py
      - name: Verify PLX Q1 2026 B01 forensic code 133 317, signed notes, opening-zero residual, fail-closed guard
        run: python scripts/verify_plx_q1_2026_b01_forensic.py
      - name: Verify PLX Q1 2026 0.1 percent tolerance only after Stockbiz Cophieu68 iWinStock cross-source display agreement
        run: python scripts/verify_plx_q1_2026_b01_tolerance.py
      - name: Verify PLX Q2 2026 original 41 VND checks and reviewed H1 cash-vintage isolation
        run: python scripts/verify_plx_q2_2026_original.py
      - name: Verify independent official HOSE PLX Q3 and H1 explanatory disclosures, quarantine parent B03
        run: python scripts/verify_plx_hose_independent_disclosures.py
      - name: Verify GAS Q1 2025 original B01 B02 B03 source values
        run: python scripts/verify_gas_q1_source.py
      - name: Verify GAS Q2 2025 B01 B02 quarterly and B03 H1 minus Q1
        run: python scripts/verify_gas_q2_source.py
      - name: Verify GAS Q3 2025 visually inspected PDF reconciliation
        run: python scripts/verify_gas_q3_visual.py
      - name: Verify GAS Q4 2025 original B01 B02 and FY less 9M B03
        run: python scripts/verify_gas_q4_visual.py
      - name: Verify GAS Q1/Q2 2026 B01 B02 and quarterly cash flow with flagged comparatives
        run: python scripts/verify_gas_2026_q1_q2_visual.py
      - name: Verify GAS audited 2025 and reviewed H1 2026 source differences
        run: python scripts/verify_gas_reviewed_h1_versions.py
      - name: Verify GAS 2026 Q3 nine-month income corroborates H1 and flags standalone mismatch
        run: python scripts/verify_gas_2026_h1_q3_bridge.py
      - name: Verify VDS consolidated Q3 2026 original statements B01 B02 and B03 YTD
        run: python scripts/verify_vds_q3_2026_source.py
      - name: Validate VDS H1 source and Q3 standalone cash from 9M less 6M
        run: python scripts/verify_vds_q2h1_q3cash_bridge.py
      - name: Verify VDS consolidated Q2 2026 original B01 B02 exact source identities
        run: python scripts/verify_vds_q2_2026_source.py
      - name: Verify VDS Q1 2026 original B01 B02 B03 and Q2 issuer cash bridge
        run: python scripts/verify_vds_q1_2026_source.py
      - name: Verify VDS consolidated Q4 2025 original B01 B02 and 12M B03
        run: python scripts/verify_vds_q4_2025_source.py
      - name: Verify VDS Q3 2025 issuer original and FY-minus-9M Q4 cash bridge
        run: python scripts/verify_vds_q3_2025_source.py
      - name: Verify VDS 2025 Q1 Q2 issuer originals and quarterly cashflow bridges
        run: python scripts/verify_vds_q1q2_2025_source.py
      - name: Verify VDS reviewed H1 2025 parent NCI allocation original-vintage exception
        run: python scripts/verify_vds_h1_2025_reviewed_attribution.py
      - name: Verify GEG Q1 2026 signed B09 notes 5 and 16a, exact 31 March cash with pledged amount not disclosed
        run: python scripts/verify_geg_2026q1_note5_march31_restricted_cash.py
      - name: Verify user-uploaded signed GEG H1 2026 EY-reviewed Note37 and original-vintage B03 bridge
        run: python scripts/verify_geg_2026_h1_uploaded_reviewed_version.py
      - name: Verify GEG Q3 signed 9M reviewed H1 alternate cash bridge and quarter-only Q2 quarantine
        run: python scripts/verify_geg_2026q3_reviewed_h1_bridge.py
      - name: Verify GEG issuer-accepted closure with FY2026 audited follow-up and no invented Q2 cash flow
        run: python scripts/verify_geg_issuer_accepted_completion.py
      - name: Verify GEG 2026 Q2 signed note11 restricted deposit 11.422bn cash-equivalent classification and fail-closed standalone
        run: python scripts/verify_geg_q2_2026_pledged_deposit_note11.py
      - name: Verify GEG consolidated Q2 2026 signed B01 B02 and 6M B03
        run: python scripts/verify_geg_q2_2026_source.py
      - name: Verify GEG 2026 Q1 issuer original and cross-vintage H1 cash opening exception
        run: python scripts/verify_geg_q1_2026_source.py
      - name: Verify GEG Q4 2025 signed original B01 B02 and annual B03 including cash vintage
        run: python scripts/verify_geg_q4_2025_original.py
      - name: Verify GEG Q3 2025 signed B01 B02 9M B03 and standalone Q4 cash
        run: python scripts/verify_geg_q3_2025_original.py
      - name: Verify GEG Q2 2025 issuer original and Q3 standalone cash bridge
        run: python scripts/verify_geg_q2_2025_original.py
      - name: Verify GEG 2025 Q1 issuer original and Q2 standalone cash bridge
        run: python scripts/verify_geg_q1_2025_original.py
      - name: Verify IDC consolidated Q3 2026 original B01 B02 and 9M B03 at VND level
        run: python scripts/verify_idc_q3_2026_original.py
      - name: Verify IDC 2026 Q2 original B01 B02 H1 B03 and Q3 standalone cash bridge
        run: python scripts/verify_idc_q2_2026_original.py
      - name: Verify IDC Q1 TT99 vs reviewed H1 TT43 current-period B03 vintage and 2025 prior Note41 cash reclassification
        run: python scripts/verify_idc_q2_2026_tt43_signed_current_period_vintage.py
      - name: Verify IDC 7-of-7 issuer-source completion with 890,796,892 VND TT43 comparative exception and FY2026 recheck
        run: python scripts/verify_idc_issuer_source_accepted_completion.py
      - name: Verify IDC H1 2026 original reviewed Note 41 TT99 opening-cash reclassification
        run: python scripts/verify_idc_2026_h1_note41_reclassification.py
      - name: Verify IDC 2026 Q1 original B01 B02 B03 and H1 opening-cash vintage exception
        run: python scripts/verify_idc_q1_2026_original.py
      - name: Verify IDC 2025 Q4 issuer and audited cash source-vintage conflict
        run: python scripts/verify_idc_q4_2025_original.py
      - name: Verify IDC 2025 Q3 HNX original and derived standalone 2025 Q4 cash bridge
        run: python scripts/verify_idc_q3_2025_original.py
      - name: Validate SFTP scripts syntax
        run: bash -n scripts/check_sftp.sh scripts/deploy_sftp.sh scripts/verify_hostinger_ssh_hostkey.sh
      - name: Validate production JSON and archived JS syntax
        run: python scripts/validate.py
      - name: Stage JSON and verify package
        run: python scripts/prepare_deploy.py
      - name: Ensure staged JSON matches latest Git data exactly (no ZIP rollback)
        run: python scripts/verify_deploy_stage.py
