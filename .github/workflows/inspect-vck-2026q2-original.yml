name: Inspect signed VCK 2026Q2 original PDF (read-only)
on:
  push:
    branches: [work/vck-2026q2-signed-h1-original-20261122]
    paths:
      - scripts/inspect_vck_2026q2_signed_original.py
      - .github/workflows/inspect-vck-2026q2-original.yml
  pull_request:
    paths:
      - scripts/inspect_vck_2026q2_signed_original.py
      - .github/workflows/inspect-vck-2026q2-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install source PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Python syntax check
        run: python -m py_compile scripts/inspect_vck_2026q2_signed_original.py
      - name: Verify VPS Q2 signed PDF source identity and render financial pages
        run: python -u scripts/inspect_vck_2026q2_signed_original.py
      - name: Retain only source screenshots one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vck-2026q2-original-PDF-page-previews
          path: vck-2026q2-source-previews/*.jpg
          retention-days: 1
          if-no-files-found: warn
