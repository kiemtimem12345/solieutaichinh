name: Inspect VCK Q2 2026 original signed issuer PDF (read-only)
on:
  push:
    branches: [work/vck-2026q2-issuer-pdf-b01-b02-b03-20261122]
    paths:
      - scripts/inspect_vck_2026q2_original_pdf.py
      - .github/workflows/inspect-vck-2026q2-original.yml
  pull_request:
    paths:
      - scripts/inspect_vck_2026q2_original_pdf.py
      - .github/workflows/inspect-vck-2026q2-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF utilities
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Syntax validation
        run: python -m py_compile scripts/inspect_vck_2026q2_original_pdf.py
      - name: Hash and visually inspect original B01 B02 B03
        run: python -u scripts/inspect_vck_2026q2_original_pdf.py
      - name: Retain only selected signed page previews one day
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vck-2026q2-issuer-signed-pdf-previews
          path: vck-2026q2-original-previews/*.jpg
          retention-days: 1
          if-no-files-found: warn
