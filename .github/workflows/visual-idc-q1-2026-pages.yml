name: Inspect IDC consolidated 2026 Q1 original source images
on:
  push:
    branches: [work/idc-2026q1-original-comparative-20261119]
    paths:
      - 'scripts/emit_idc_q1_2026_visual_jpeg.py'
      - '.github/workflows/visual-idc-q1-2026-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral PDF renderer
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28' 'pillow>=10,<13'
      - name: Read original IDC Q1 consolidated report images
        run: python -u scripts/emit_idc_q1_2026_visual_jpeg.py
