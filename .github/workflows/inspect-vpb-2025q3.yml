name: Inspect VPB 2025 Q3 original ZIP and issuer lookup bank B02a B03a B04a (read-only)
on:
  pull_request:
    paths:
      - 'scripts/inspect_vpb_2025q3_sources.py'
      - '.github/workflows/inspect-vpb-2025q3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpb-2025q3-issuer-original
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Source inspector syntax
        run: python -m py_compile scripts/inspect_vpb_2025q3_sources.py
      - name: Recover original signed ZIP and issuer lookup B02 B03 B04
        run: python -u scripts/inspect_vpb_2025q3_sources.py
      - name: Retain visuals briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpb-2025q3-original-issuer-source
          path: vpb-2025q3-source/*
          retention-days: 1
          if-no-files-found: warn
