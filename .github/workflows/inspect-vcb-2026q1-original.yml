name: Inspect VCB 2026Q1 official HOSE consolidated original (read-only)
on:
  push:
    branches: [work/vcb-2026q1-original-consolidated-20261122]
    paths:
      - scripts/inspect_vcb_2026q1_hose_original.py
      - .github/workflows/inspect-vcb-2026q1-original.yml
  pull_request:
    paths:
      - scripts/inspect_vcb_2026q1_hose_original.py
      - .github/workflows/inspect-vcb-2026q1-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF source utilities
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Check source script
        run: python -m py_compile scripts/inspect_vcb_2026q1_hose_original.py
      - name: Recover original signed Q1 2026 issuer consolidated and visual B02 B03 B04
        run: python -u scripts/inspect_vcb_2026q1_hose_original.py
      - name: Short-lived issuer pages, not entire PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcb-2026q1-hose-signed-original-previews
          path: vcb-2026q1-consolidated-preview/*.jpg
          if-no-files-found: warn
          retention-days: 1
