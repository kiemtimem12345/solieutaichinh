name: Inspect VCI Q3 2025 issuer-signed original (read-only)
on:
  push:
    branches: [work/vci-2025q3-issuer-source-20261121]
    paths:
      - scripts/inspect_vci_2025q3_original_source.py
      - .github/workflows/inspect-vci-2025q3-original.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils curl
      - name: Source script syntax
        run: python -m py_compile scripts/inspect_vci_2025q3_original_source.py
      - name: Download issuer Q3 signed PDF, compute identity and render early pages
        run: python -u scripts/inspect_vci_2025q3_original_source.py
      - name: Keep only small one-day visual-source excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-2025q3-signed-issuer-b01-b02-b03-preview
          path: vci-2025q3-previews/*.jpg
          if-no-files-found: warn
          retention-days: 1
