name: Recover PLX Q3 2025 original consolidated B01 B02 B03
on:
  push:
    branches: [work/plx-2025q3-original-b01b02b03-20261120]
    paths:
      - scripts/recover_plx_q3_2025_consolidated_original.py
      - .github/workflows/recover-plx-2025q3-consolidated-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28'
      - name: Recover signed Q3 consolidated original and B01 B02 9M B03 source pages
        run: python -u scripts/recover_plx_q3_2025_consolidated_original.py
      - name: Save signed original PDF and full-page visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plx-2025q3-original-consolidated-b01b02b03
          path: plx-2025-q3-consolidated-original/
          retention-days: 7
          if-no-files-found: warn
