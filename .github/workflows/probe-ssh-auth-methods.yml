name: Probe Hostinger SSH authentication methods (no credentials)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_ssh_auth_methods.sh'
      - '.github/workflows/probe-ssh-auth-methods.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SSH authentication negotiation without secrets
        run: bash scripts/probe_ssh_auth_methods.sh
