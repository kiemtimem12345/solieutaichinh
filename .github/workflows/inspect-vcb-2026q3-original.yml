name: Inspect VCB 2026Q3 HOSE original signed consolidated (read-only)
on:
  push:
    branches: [work/vcb-2026q3-HOSE-signed-original-20261122]
    paths:
      - scripts/inspect_vcb_2026q3_original.py
      - .github/workflows/inspect-vcb-2026q3-original.yml
  pull_request:
    paths:
      - scripts/inspect_vcb_2026q3_original.py
      - .github/workflows/inspect-vcb-2026q3-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Check Python inspector
        run: python -m py_compile scripts/inspect_vcb_2026q3_original.py
      - name: Recover signed VCB consolidated 9M original and page provenance
        run: python -u scripts/inspect_vcb_2026q3_original.py
      - name: One-day selected issuer source pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcb-2026q3-signed-consolidated-original-previews
          path: vcb-2026q3-consolidated-preview/*.jpg
          retention-days: 1
          if-no-files-found: warn
