name: Inspect CTG Q3 2026 original consolidated and H1 (read-only)
on:
  push:
    branches: [work/ctg-2026q3-consolidated-source-20261122]
    paths:
      - scripts/inspect_ctg_2026q3_h1_consolidated_source.py
      - .github/workflows/inspect-ctg-2026q3-h1-original.yml
  pull_request:
    paths:
      - scripts/inspect_ctg_2026q3_h1_consolidated_source.py
      - .github/workflows/inspect-ctg-2026q3-h1-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Syntax check
        run: python -m py_compile scripts/inspect_ctg_2026q3_h1_consolidated_source.py
      - name: Signed source proof Q3 9M and H1 6M
        run: python -u scripts/inspect_ctg_2026q3_h1_consolidated_source.py
      - name: Retain limited original bank statement visual pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctg-2026q3-h1-issuer-consolidated-original
          path: ctg-2026q3-h1-consolidated-previews/*.jpg
          retention-days: 1
          if-no-files-found: warn
