name: Inspect VPB 2026 Q2 original and H1 reviewed sources
on:
  pull_request:
    paths:
      - 'scripts/inspect_vpb_2026q2_signed_reviewed_sources.py'
      - '.github/workflows/inspect-vpb-2026q2-h1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpb-2026q2-issuer-h1
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl poppler-utils
      - name: Source inspector syntax
        run: python -m py_compile scripts/inspect_vpb_2026q2_signed_reviewed_sources.py
      - name: Recover signed Q2 and reviewed H1
        run: python -u scripts/inspect_vpb_2026q2_signed_reviewed_sources.py
      - name: Retain signed source text briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpb-2026q2-h1-original-source
          path: vpb-2026q2-original-source/*
          retention-days: 1
          if-no-files-found: warn
