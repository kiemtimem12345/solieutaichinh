name: Inspect VCK Q4 2025 signed issuer original ZIP (read-only)
on:
  push:
    branches: [work/vck-2025q4-issuer-fy-source-20261122]
    paths:
      - scripts/inspect_vck_2025q4_original_source.py
      - .github/workflows/inspect-vck-2025q4-original.yml
  pull_request:
    paths:
      - scripts/inspect_vck_2025q4_original_source.py
      - .github/workflows/inspect-vck-2025q4-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install curl poppler
        run: sudo apt-get update -qq && sudo apt-get install -qq -y curl poppler-utils
      - name: Check Python syntax
        run: python -m py_compile scripts/inspect_vck_2025q4_original_source.py
      - name: Identify original Q4 signed ZIP member and render B01 B02 B03 evidence
        run: python -u scripts/inspect_vck_2025q4_original_source.py
      - name: Upload only temporary preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vck-2025q4-vps-signed-statement-preview
          path: vck-2025q4-original-previews/*.jpg
          retention-days: 1
          if-no-files-found: warn
